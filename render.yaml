services:
  - type: web
    name: page-pulse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: REDIS_URL
        sync: false
      - key: CACHE_TTL
        value: "300"
      - key: REQUEST_TIMEOUT
        value: "10.0"
      - key: MAX_CONCURRENT_REQUESTS
        value: "10"
      - key: RATE_LIMIT
        value: "10/minute"
